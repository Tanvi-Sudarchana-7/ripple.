<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Ripple is a place to share ideas and discover new perspectives.">
  <title>Ripple | Ideas travel further</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #687386;
      --accent: #6558e8;
      --border: #e4e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(255,255,255,.95);
      border-bottom: 1px solid var(--border);
      padding: 15px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .brand span { color: var(--accent); }

    .tagline {
      color: var(--muted);
      font-size: 13px;
    }

    main {
      width: min(760px, 92%);
      margin: 30px auto;
    }

    .welcome { margin-bottom: 24px; }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: -1.5px;
      margin: 0 0 8px;
    }

    .muted { color: var(--muted); }

    .panel, .post {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(30,40,80,.035);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font: inherit;
      margin-bottom: 13px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid #c8c2ff;
      border-color: var(--accent);
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover { background: #5044cf; }

    .tools {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 22px 0;
    }

    .tools input {
      flex: 1 1 220px;
      margin: 0;
    }

    .tools select {
      width: auto;
      max-width: 100%;
      margin: 0;
    }

    .post-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ece9ff;
      color: #5144cb;
      font-weight: 850;
      flex-shrink: 0;
    }

    .post h3 {
      margin: 0 0 5px;
      font-size: 19px;
    }

    .post p {
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .category {
      display: inline-block;
      padding: 5px 9px;
      background: #f0efff;
      color: #5144cb;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 750;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .secondary {
      background: #f0f2f8;
      color: #283148;
    }

    .liked {
      background: #ffe9ef;
      color: #bd315d;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 25px;
    }

    @media (max-width: 480px) {
      header { padding: 13px 4%; }
      .tagline { display: none; }
      main { margin-top: 22px; }
      .panel, .post { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">ripple<span>.</span></div>
    <div class="tagline">One idea can change everything.</div>
  </header>

  <main>
    <section class="welcome">
      <h1>Ideas travel further. 🌍</h1>
      <p class="muted">
        Share what you're thinking. Discover what the world is imagining.
      </p>
    </section>

    <section class="panel">
      <h2 style="margin-top:0">Share an idea</h2>

      <form id="postForm">
        <label for="author">Your display name</label>
        <input id="author" maxlength="35"
          placeholder="What should people call you?" required>

        <label for="title">Give your idea a title</label>
        <input id="title" maxlength="100"
          placeholder="What have you been thinking about?" required>

        <label for="content">Tell us about it</label>
        <textarea id="content" maxlength="1200"
          placeholder="Your idea could inspire someone..." required></textarea>

        <label for="category">Choose a category</label>
        <select id="category">
          <option>Technology</option>
          <option>Science</option>
          <option>Education</option>
          <option>Environment</option>
          <option>Creativity</option>
          <option>Community</option>
          <option>Other</option>
        </select>

        <button class="primary" type="submit">Publish idea ↗</button>
      </form>
    </section>

    <div class="tools">
      <input id="search" type="search"
        placeholder="Search ideas..." aria-label="Search ideas">

      <select id="filter" aria-label="Filter by category">
        <option value="All">All ideas</option>
        <option>Technology</option>
        <option>Science</option>
        <option>Education</option>
        <option>Environment</option>
        <option>Creativity</option>
        <option>Community</option>
        <option>Other</option>
      </select>
    </div>

    <section id="feed" aria-live="polite"></section>
  </main>

  <footer>
    Ripple · Share ideas. Discover perspectives. Make waves.
  </footer>

  <script>
    const starterPosts = [
      {
        id: 1,
        author: "Ripple Community",
        title: "Learning should be an adventure",
        content: "Imagine a free learning platform where anyone can explain a concept in their own way, and learners from everywhere can share what works for them.",
        category: "Education",
        likes: 3,
        liked: false
      },
      {
        id: 2,
        author: "A Curious Thinker",
        title: "Small changes, cleaner cities",
        content: "What if every neighbourhood had a shared map of refill stations, recycling points, and community clean-up events?",
        category: "Environment",
        likes: 5,
        liked: false
      },
      {
        id: 3,
        author: "Future Maker",
        title: "A notebook for big ideas",
        content: "Create a space where people can develop an idea together, improve it with feedback, and give credit to everyone who contributed.",
        category: "Technology",
        likes: 2,
        liked: false
      }
    ];

    const storageKey = "ripple-demo-posts-v1";
    let posts = starterPosts;

    try {
      const saved = localStorage.getItem(storageKey);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) posts = parsed;
      }
    } catch (error) {
      console.log("Using demo posts.");
    }

    const feed = document.getElementById("feed");
    const search = document.getElementById("search");
    const filter = document.getElementById("filter");
    const form = document.getElementById("postForm");

    function savePosts() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(posts));
      } catch (error) {
        alert("Your browser could not save the changes.");
      }
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderPosts() {
      feed.replaceChildren();

      const term = search.value.trim().toLowerCase();
      const selectedCategory = filter.value;

      const visiblePosts = posts.filter(post => {
        const matchesCategory =
          selectedCategory === "All" ||
          post.category === selectedCategory;

        const searchable = [
          post.title, post.content, post.author, post.category
        ].join(" ").toLowerCase();

        return matchesCategory && searchable.includes(term);
      });

      if (visiblePosts.length === 0) {
        feed.append(
          makeElement("div", "panel empty",
            "No matching ideas yet. Try another search or publish one!")
        );
        return;
      }

      visiblePosts.forEach(post => {
        const card = makeElement("article", "post");
        const top = makeElement("div", "post-top");
        const initial = (post.author || "?").trim().charAt(0).toUpperCase();

        top.append(
          makeElement("div", "avatar", initial || "?")
        );

        const authorBox = makeElement("div");
        authorBox.append(
          makeElement("strong", "", post.author),
          makeElement("div", "muted", "Ripple contributor")
        );
        top.append(authorBox);

        card.append(top);
        card.append(makeElement("span", "category", post.category));
        card.append(makeElement("h3", "", post.title));
        card.append(makeElement("p", "", post.content));

        const actions = makeElement("div", "actions");
        const likeButton = makeElement(
          "button",
          post.liked ? "liked" : "secondary",
          (post.liked ? "♥ Liked · " : "♡ Like · ") + post.likes
        );

        likeButton.type = "button";
        likeButton.setAttribute(
          "aria-pressed", String(Boolean(post.liked))
        );

        likeButton.addEventListener("click", () => {
          post.liked = !post.liked;
          post.likes = Math.max(
            0, post.likes + (post.liked ? 1 : -1)
          );
          savePosts();
          renderPosts();
        });

        const shareButton = makeElement(
          "button", "secondary", "Share ↗"
        );

        shareButton.type = "button";
        shareButton.addEventListener("click", async () => {
          const shareText = post.title + "\n\n" +
            post.content + "\n\nShared from Ripple";

          try {
            if (navigator.share) {
              await navigator.share({
                title: post.title,
                text: shareText
              });
            } else if (navigator.clipboard) {
              await navigator.clipboard.writeText(shareText);
              alert("Idea copied! You can share it with others.");
            } else {
              alert(shareText);
            }
          } catch (error) {
            if (error.name !== "AbortError") {
              alert("Sharing is unavailable in this browser.");
            }
          }
        });

        actions.append(likeButton, shareButton);
        card.append(actions);
        feed.append(card);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const author = document.getElementById("author").value.trim();
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const category = document.getElementById("category").value;

      if (!author || !title || !content) return;

      posts.unshift({
        id: Date.now(),
        author,
        title,
        content,
        category,
        likes: 0,
        liked: false
      });

      savePosts();
      form.reset();
      search.value = "";
      filter.value = "All";
      renderPosts();
    });

    search.addEventListener("input", renderPosts);
    filter.addEventListener("change", renderPosts);

    renderPosts();
  </script>
</body>
  </html>
